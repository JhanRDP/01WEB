<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELECTRIC</title>
    <script>
        (function () {
            // Redirección mínima a la página dinámica. Se conserva el id de
            // producto cuando es un entero positivo; si no, se vuelve al inicio.
            var params = new URLSearchParams(window.location.search);
            var ids = params.getAll('id');
            if (ids.length === 1 && /^[1-9][0-9]{0,9}$/.test(ids[0])) {
                window.location.replace('producto.php?id=' + encodeURIComponent(ids[0]));
                return;
            }
            window.location.replace('index.php');
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=index.php"></noscript>
</head>
<body>
    <p>Redirigiendo a <a href="index.php">ELECTRIC</a>&hellip;</p>
</body>
</html>
